# Render.com blueprint for ATLAS. Deploy: push this repo to GitHub, then in
# Render -> New -> Blueprint -> pick the repo. Set the `sync: false` secrets in
# the dashboard (they are never committed).
services:
  - type: web
    name: atlas
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ATLAS_MODEL
        value: gemini-flash-lite-latest
      - key: ATLAS_TZ
        value: Asia/Kolkata
      # ---- secrets: set these in the Render dashboard (Environment tab) ----
      # AI engine — free key from aistudio.google.com/app/apikey
      - key: GEMINI_API_KEY
        sync: false
      # Accounts (optional) — Supabase project → Settings → API
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      # Durable data — Supabase → Settings → Database → Connection string (URI).
      # Use the POOLER URI (port 6543) for a web service. Leave unset = SQLite.
      - key: DATABASE_URL
        sync: false
      # Google Calendar + Gmail (optional). Generate token.json locally with
      # `python authorize.py`, then paste file contents into these:
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: GOOGLE_TOKEN_JSON
        sync: false
      # Telegram channel (optional). Token from @BotFather. Set RUN_TELEGRAM_IN_WEB=1
      # to run the bot inside this web service (no extra worker needed).
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: RUN_TELEGRAM_IN_WEB
        value: "1"
      # Phone calls (optional) — Twilio (console.twilio.com). PUBLIC_BASE_URL must
      # be this service's public URL so Twilio can fetch the call audio/TwiML.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      # Web-push (optional). Auto-generated if unset, but Render's disk is
      # ephemeral so set a fixed pair here to keep subscriptions valid across
      # deploys. Generate once: python -c "import push,json;print(json.dumps(push.keys()))"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      # ---- durable storage (optional) ----
      # Free tier has an EPHEMERAL disk: tasks reset when the instance restarts.
      # For persistence, attach a Render Disk (paid) and point the DB at it:
      #   - key: ATLAS_DB
      #     value: /var/data/atlas.db
      # ...and add a `disk:` block below. Or migrate to Supabase Postgres.
